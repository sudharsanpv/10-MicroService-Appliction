
name: Build, tag, push docker image
on:
  push:
    branches:
      - stage
env:
  IMAGE_NAME: go-app-frontend
       

jobs:
  build:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner


    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.19

      - name: Build Go Binary
        working-directory: src/frontend
        run: |
          ls -la
          go mod tidy
          go build -o app  

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: src/frontend/app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1    

      #  Bump and push Git tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # or use 'minor' / 'major'

      # ✅ Export the tag as env
      - name: Use tag as version
        run: |
          echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV

      # ✅ Build and Push Docker Image
      - name: Build Docker image
        run: |
          cd src/frontend
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:${{ env.VERSION }}
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "Pushed image: $IMAGE_URI"