
name: Build, tag, push docker image
on:
  push:
    branches:
      - stage
env:
  IMAGE_NAME: go-app
  
        

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.19

      - name: Build Go Binary
        working-directory: src/frontend
        run: |
          ls -la
          go mod tidy
          go build -o app  

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: src/frontend/app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1    

      - name: Extract semantic version
        id: semver
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::set-output name=version::$VERSION"
        shell: bash

      - name: Build Docker image with semantic version
        working-directory: src/frontend
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:${{ env.VERSION }}
          docker build -t $IMAGE_URI frontend/Dockerfile frontend
          docker push $IMAGE_URI
          echo "Pushed image: $IMAGE_URI"
